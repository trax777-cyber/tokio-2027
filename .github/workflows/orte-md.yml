name: orte.md aktualisieren
on:
  push:
    branches: [main]
    paths: [quelle/orte.json, tools/orte_md.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/orte_md.py
      - run: |
          git diff --quiet orte.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add orte.md
          git commit -m "orte.md automatisch aktualisiert"
          git push
