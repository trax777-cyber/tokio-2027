<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tokio 2027">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f0eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191b1e" media="(prefers-color-scheme: dark)">
<title>Tokio 2027 Orte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2f0eb;
    --paper-2: #e9e6de;
    --ink: #23262b;
    --ink-soft: #5d6166;
    --line: #d8d4c9;
    --card: #ffffff;
    --indigo: #2f3e50;
    --indigo-soft: #e2e7ec;
    --vermillion: #b1462f;
    --vermillion-soft: #f4e4df;
    --gold: #97702a;
    --gold-soft: #f1e8d4;
    --sage: #4d6a52;
    --sage-soft: #e3ebe3;
    --focus: #2f6fed;
    --shadow: 0 10px 40px rgba(35, 38, 43, 0.18);
    --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
    --sans: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #191b1e;
      --paper-2: #202226;
      --ink: #ece9e2;
      --ink-soft: #a7aab0;
      --line: #35383d;
      --card: #24262a;
      --indigo: #9db4cc;
      --indigo-soft: #263041;
      --vermillion: #df917c;
      --vermillion-soft: #3a2521;
      --gold: #d3b06a;
      --gold-soft: #3a3120;
      --sage: #9bc0a1;
      --sage-soft: #22301f;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #191b1e;
    --paper-2: #202226;
    --ink: #ece9e2;
    --ink-soft: #a7aab0;
    --line: #35383d;
    --card: #24262a;
    --indigo: #9db4cc;
    --indigo-soft: #263041;
    --vermillion: #df917c;
    --vermillion-soft: #3a2521;
    --gold: #d3b06a;
    --gold-soft: #3a3120;
    --sage: #9bc0a1;
    --sage-soft: #22301f;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; box-sizing: border-box; }
  body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { height: 100%; display: flex; flex-direction: column; }

  /* ---------- header ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px 10px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .hanko {
    flex: none;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: var(--vermillion); color: var(--paper);
    font-family: var(--serif); font-weight: 700; font-size: 15px; line-height: 1;
    writing-mode: vertical-rl; letter-spacing: 0.05em;
    border-radius: 6px;
  }
  .brand h1 {
    margin: 0; font-family: var(--serif); font-weight: 700;
    font-size: 22px; line-height: 1.1; letter-spacing: 0.01em;
  }
  .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .count { font-size: 13px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .count b { color: var(--ink); font-weight: 600; }

  /* ---------- search + chips ---------- */
  .tools { max-width: 820px; width: 100%; margin: 0 auto; padding: 0 16px; display: grid; gap: 10px; }
  .search-row { display: flex; gap: 8px; }
  .search {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 0 12px;
  }
  .search:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .search svg { flex: none; color: var(--ink-soft); }
  .search input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    padding: 11px 0; font: inherit; font-size: 16px; color: var(--ink);
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .clear-q { border: 0; background: none; padding: 4px; cursor: pointer; color: var(--ink-soft); font-size: 18px; line-height: 1; }
  .filter-btn {
    position: relative; flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 0 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .filter-btn .dot {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--vermillion); color: var(--paper);
    font-size: 11px; display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .chips {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -16px; padding: 0 16px 10px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 13.5px; cursor: pointer;
  }
  .chip .k { font-family: var(--serif); font-weight: 700; font-size: 14px; color: var(--ink); }
  .chip.all { padding-left: 12px; }
  .chip[aria-pressed="true"] { background: var(--indigo); border-color: var(--indigo); color: var(--paper); }
  .chip[aria-pressed="true"] .k { color: var(--paper); }
  .chip .n { font-variant-numeric: tabular-nums; opacity: 0.75; font-size: 12px; }

  /* ---------- views ---------- */
  main { flex: 1; min-height: 0; position: relative; border-top: 1px solid var(--line); }
  .view { position: absolute; inset: 0; }
  .view.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .list-wrap { max-width: 820px; margin: 0 auto; padding: 4px 16px 24px; }

  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
  .row {
    flex: 1; min-width: 0; display: flex; gap: 12px; align-items: flex-start;
    text-align: left; border: 0; background: none; padding: 13px 0; cursor: pointer;
  }
  .stamp {
    flex: none; width: 38px; height: 38px; border-radius: 8px;
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1;
  }
  .g-food { background: var(--vermillion-soft); color: var(--vermillion); }
  .g-cafe { background: var(--gold-soft); color: var(--gold); }
  .g-shop { background: var(--indigo-soft); color: var(--indigo); }
  .g-calm { background: var(--sage-soft); color: var(--sage); }
  .g-misc { background: var(--paper-2); color: var(--ink-soft); }
  .body { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .name { font-weight: 600; font-size: 15.5px; line-height: 1.3; }
  .sub { font-size: 13px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .sub .rate { color: var(--ink); font-variant-numeric: tabular-nums; }
  .desc {
    font-size: 13px; color: var(--ink-soft); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .note-line { font-size: 13px; color: var(--vermillion); }
  .tag-done {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--sage); background: var(--sage-soft); border-radius: 4px; padding: 1px 6px;
  }
  .item.done .name { color: var(--ink-soft); }
  .fav {
    flex: none; width: 48px; border: 0; background: none; cursor: pointer;
    font-size: 22px; line-height: 1; color: var(--line); padding: 0;
  }
  .fav[aria-pressed="true"] { color: var(--gold); }
  .fav:hover { color: var(--gold); }

  .empty { padding: 48px 8px; text-align: center; color: var(--ink-soft); line-height: 1.6; }
  .empty strong { display: block; font-family: var(--serif); font-size: 18px; color: var(--ink); margin-bottom: 4px; }
  .link-btn { border: 0; background: none; color: var(--indigo); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }

  .section-h {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft); margin: 18px 0 2px;
  }
  .progress { margin: 14px 0 4px; display: grid; gap: 6px; }
  .progress .txt { font-size: 13.5px; color: var(--ink-soft); }
  .progress .txt b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--sage); border-radius: 3px; }

  /* ---------- map ---------- */
  .map-view { display: flex; flex-direction: column; }
  .map-box { flex: 1; min-height: 0; position: relative; isolation: isolate; z-index: 0; background: var(--paper-2); overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--paper-2); font-family: var(--sans); }
  #map .leaflet-control-zoom a, .home-ctl a {
    background: var(--card); color: var(--ink); border-color: var(--line);
    width: 36px; height: 36px; line-height: 36px; font-size: 18px;
  }
  .home-ctl a { display: block; text-align: center; text-decoration: none; font-size: 16px; border-radius: 4px; }
  #map .leaflet-bar { border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  #map .leaflet-control-attribution { background: var(--paper); color: var(--ink-soft); font-size: 10px; }
  #map .leaflet-control-attribution a { color: var(--ink-soft); }
  #map .leaflet-tooltip { font-family: var(--sans); font-size: 13px; font-weight: 600; background: var(--card); color: var(--ink); border-color: var(--line); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
  #map .leaflet-tooltip-top:before { border-top-color: var(--card); }
  .map-offline { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-soft); line-height: 1.6; }
  .legend {
    position: absolute; left: 10px; bottom: 22px; right: 10px; z-index: 500;
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-size: 12px; color: var(--ink-soft);
    pointer-events: none;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; background: var(--card); padding: 3px 8px; border-radius: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .map-note {
    padding: 10px 16px; font-size: 13px; color: var(--ink-soft); border-top: 1px solid var(--line);
    background: var(--paper);
  }

  /* ---------- tabs ---------- */
  .tabs {
    display: flex; justify-content: center; gap: 4px;
    border-top: 1px solid var(--line); background: var(--paper);
    padding: 6px 8px;
  }
  .tab {
    flex: 1; max-width: 200px; border: 0; background: none; cursor: pointer;
    display: grid; justify-items: center; gap: 1px; padding: 6px 4px;
    border-radius: 10px; color: var(--ink-soft); font-size: 12px; font-weight: 600;
    position: relative;
  }
  .tab .ico { font-family: var(--serif); font-size: 19px; line-height: 1.1; font-weight: 700; }
  .tab[aria-selected="true"] { color: var(--vermillion); background: var(--vermillion-soft); }
  .tab .badge {
    position: absolute; top: 2px; left: calc(50% + 10px);
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--gold); color: var(--paper); font-size: 10.5px; display: grid; place-items: center;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- sheets ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(20, 22, 25, 0.42); z-index: 20;
    opacity: 0; transition: opacity 0.18s;
  }
  .scrim.on { opacity: 1; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 640px; margin: 0 auto;
    max-height: 90%;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
    padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%); transition: transform 0.22s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.on { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .scrim { transition: none; }
  }
  .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
  .sheet-close {
    position: sticky; top: 0; float: right; margin: -4px -8px 0 0;
    width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--paper-2);
    font-size: 18px; cursor: pointer; z-index: 1;
  }
  .d-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
  .d-head .stamp { width: 52px; height: 52px; font-size: 26px; border-radius: 10px; }
  .d-kat { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .d-head h2 {
    margin: 2px 0 4px; font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.2;
    text-wrap: balance; overflow-wrap: anywhere;
  }
  .d-where { font-size: 14px; color: var(--ink-soft); }
  .d-rate { font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .d-rate .stars { color: var(--gold); letter-spacing: 1px; }
  .d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 10px; }
  .toggle {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line); background: var(--card); border-radius: 12px;
    padding: 12px 10px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .toggle .i { font-size: 18px; line-height: 1; }
  .toggle.fav-t[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .toggle.done-t[aria-pressed="true"] { background: var(--sage-soft); border-color: var(--sage); color: var(--sage); }
  .d-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pill-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
    text-decoration: none; color: var(--indigo); background: var(--indigo-soft); border: 0; cursor: pointer;
  }
  .pill-link.primary { background: var(--indigo); color: var(--paper); }
  .d-sec { border-top: 1px solid var(--line); padding: 14px 0; }
  .d-sec h3 {
    margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft);
    display: flex; justify-content: space-between; align-items: center;
  }
  .d-sec h3 button { text-transform: none; letter-spacing: 0; font-size: 13px; }
  .d-sec p { margin: 0; line-height: 1.55; max-width: 62ch; overflow-wrap: anywhere; }
  .muted { color: var(--ink-soft); font-style: italic; }
  .addr { display: flex; gap: 10px; align-items: flex-start; }
  .addr p { flex: 1; font-size: 14px; user-select: text; -webkit-user-select: text; }
  .small-btn {
    flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 8px;
    padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  textarea {
    width: 100%; font: inherit; font-size: 16px; line-height: 1.45;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); resize: vertical; min-height: 84px;
  }
  .edit-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--indigo); border-color: var(--indigo); color: var(--paper); }
  .status { font-size: 12.5px; color: var(--ink-soft); }

  /* filter sheet */
  .f-title { font-family: var(--serif); font-weight: 700; font-size: 20px; margin: 0 0 12px; }
  .f-group { padding: 12px 0; border-top: 1px solid var(--line); }
  .f-group > label, .f-group > .lab { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 13px; font-size: 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--indigo); border-color: var(--indigo); color: var(--paper); }
  select {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; }
  .switch-row input { width: 22px; height: 22px; accent-color: var(--indigo); }
  .f-foot { display: flex; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30;
    transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; box-shadow: var(--shadow);
  }

  @media (min-width: 720px) {
    .top { padding-top: 22px; }
    .brand h1 { font-size: 26px; }
    .hanko { width: 46px; height: 46px; font-size: 17px; }
  }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="hanko" aria-hidden="true">東京</div>
      <div>
        <h1>Tokio 2027</h1>
        <p>Juli 2027 · Wien → Haneda</p>
      </div>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="tools">
    <div class="search-row">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Name, Stadtteil, Stichwort …" autocomplete="off" aria-label="Orte durchsuchen">
        <button class="clear-q" id="clear-q" type="button" aria-label="Suche leeren" hidden>×</button>
      </label>
      <button class="filter-btn" id="open-filter" type="button">Filter <span class="dot" id="filter-dot" hidden></span></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Kategorien"></div>
  </div>

  <main>
    <section class="view scroll" id="view-liste" aria-label="Liste">
      <div class="list-wrap">
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty" hidden></div>
      </div>
    </section>

    <section class="view map-view" id="view-karte" aria-label="Karte" hidden>
      <div class="map-box">
        <div id="map" aria-label="Karte der Orte"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="map-note" id="map-note"></div>
    </section>

    <section class="view scroll" id="view-merkliste" aria-label="Merkliste" hidden>
      <div class="list-wrap" id="merk-wrap"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="liste" type="button"><span class="ico">一覧</span>Liste</button>
    <button class="tab" role="tab" data-tab="karte" type="button"><span class="ico">地図</span>Karte</button>
    <button class="tab" role="tab" data-tab="merkliste" type="button"><span class="ico">☆</span>Merkliste<span class="badge" id="fav-badge" hidden></span></button>
  </nav>
</div>

  "Hotel": { k: "宿", g: "cafe" },
  "Sonstiges": { k: "他", g: "misc" }
};
const GROUPS = [["food", "Essen & Trinken"], ["cafe", "Café, Museum, Hotel"], ["shop", "Shops & Sehenswertes"], ["calm", "Schreine, Tempel, Parks"]];
const OUTSIDE = "Außerhalb der 23 Bezirke";

const DEFAULT_FILTERS = { region: "alle", bezirk: "alle", minr: 0, sort: "name", hideDone: false };
const S = { tab: "liste", q: "", kat: new Set(), ...DEFAULT_FILTERS, openId: null };
let over = {};          // id -> gespeicherte Änderungen {beschreibung?, fav, besucht, notiz}
let db = null;
let editing = null;     // "desc" | "note" | null

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const byId = new Map(DATA.map(d => [d.id, d]));
const kat = d => KAT[d.kategorie] || KAT.Sonstiges;
const desc = d => (over[d.id] && typeof over[d.id].beschreibung === "string") ? over[d.id].beschreibung : (d.beschreibung || "");
const isFav = d => !!(over[d.id] && over[d.id].fav);
const isDone = d => !!(over[d.id] && over[d.id].besucht);
const note = d => (over[d.id] && over[d.id].notiz) || "";
const fmtRating = r => r.toFixed(1).replace(".", ",");
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";

/* ---------- local prefs (per viewer) ---------- */
const PREF_KEY = "tokio2027.prefs";
const LOCAL_KEY = "tokio2027.local";
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || "null");
    if (!p) return;
    ["tab", "region", "bezirk", "minr", "sort", "hideDone"].forEach(k => { if (k in p) S[k] = p[k]; });
    if (Array.isArray(p.kat)) S.kat = new Set(p.kat.filter(k => KAT[k]));
  } catch (e) {}
}
function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({ tab: S.tab, region: S.region, bezirk: S.bezirk, minr: S.minr, sort: S.sort, hideDone: S.hideDone, kat: [...S.kat] }));
  } catch (e) {}
}

/* ---------- filtering ---------- */
function matchesQuery(d) {
  if (!S.q) return true;
  const hay = (d.name + " " + d.adresse + " " + d.bezirk + " " + d.stadtteil + " " + d.kategorie + " " + d.google_typ + " " + desc(d) + " " + note(d)).toLowerCase();
  return S.q.split(/\s+/).every(t => hay.includes(t));
}
function filtered() {
  const rows = DATA.filter(d => {
    if (S.kat.size && !S.kat.has(d.kategorie)) return false;
    if (S.region !== "alle" && d.region !== S.region) return false;
    if (S.bezirk !== "alle" && d.bezirk !== S.bezirk) return false;
    if (S.minr > 0 && (!d.rating || d.rating < S.minr)) return false;
    if (S.hideDone && isDone(d)) return false;
    return matchesQuery(d);
  });
  const coll = (a, b) => a.localeCompare(b, "de", { sensitivity: "base" });
  rows.sort((a, b) => {
    if (S.sort === "rating") return (b.rating || 0) - (a.rating || 0) || coll(a.name, b.name);
    if (S.sort === "bezirk") {
      const ao = a.bezirk === OUTSIDE, bo = b.bezirk === OUTSIDE;
      if (ao !== bo) return ao ? 1 : -1;
      return coll(a.bezirk, b.bezirk) || coll(a.name, b.name);
    }
    return coll(a.name, b.name);
  });
  return rows;
}
function activeFilterCount() {
  let n = 0;
  if (S.region !== "alle") n++;
  if (S.bezirk !== "alle") n++;
  if (S.minr > 0) n++;
  if (S.hideDone) n++;
  return n;
}

/* ---------- rendering ---------- */
function itemHtml(d) {
  const k = kat(d), ds = desc(d), n = note(d), fav = isFav(d), done = isDone(d);
  const where = d.region === "Tokio" && d.bezirk !== OUTSIDE ? d.bezirk : d.stadtteil.replace(/^Andere \((.*)\)$/, "$1");
  return `<li class="item${done ? " done" : ""}">
    <button class="row" type="button" data-open="${esc(d.id)}">
      <span class="stamp g-${k.g}" aria-hidden="true">${k.k}</span>
      <span class="body">
        <span class="name">${esc(d.name)}</span>
        <span class="sub"><span>${esc(d.kategorie)} · ${esc(where)}</span>${d.rating ? `<span class="rate">★ ${fmtRating(d.rating)}</span>` : ""}${done ? `<span class="tag-done">✓ besucht</span>` : ""}</span>
        ${n ? `<span class="note-line">✎ ${esc(n)}</span>` : ""}
        ${ds ? `<span class="desc">${esc(ds)}</span>` : ""}
      </span>
    </button>
    <button class="fav" type="button" data-fav="${esc(d.id)}" aria-pressed="${fav}" aria-label="${fav ? "Von Merkliste entfernen" : "Merken"}: ${esc(d.name)}">${fav ? "★" : "☆"}</button>
  </li>`;
}

function renderChips() {
  // Zahlen folgen allen Filtern außer der Kategorie-Auswahl selbst
  const base = DATA.filter(d => {
    if (S.region !== "alle" && d.region !== S.region) return false;
    if (S.bezirk !== "alle" && d.bezirk !== S.bezirk) return false;
    if (S.minr > 0 && (!d.rating || d.rating < S.minr)) return false;
    if (S.hideDone && isDone(d)) return false;
    return matchesQuery(d);
  });
  const counts = {};
  base.forEach(d => { counts[d.kategorie] = (counts[d.kategorie] || 0) + 1; });
  const cats = Object.keys(KAT).filter(k => counts[k] || S.kat.has(k));
  const box = $("chips"), left = box.scrollLeft;
  box.innerHTML =
    `<button type="button" class="chip all" data-kat="" aria-pressed="${S.kat.size === 0}">Alle <span class="n">${base.length}</span></button>` +
    cats.map(c => `<button type="button" class="chip" data-kat="${esc(c)}" aria-pressed="${S.kat.has(c)}"><span class="k">${KAT[c].k}</span>${esc(c)} <span class="n">${counts[c] || 0}</span></button>`).join("");
  box.scrollLeft = left;
}

function renderList(rows) {
  $("list").innerHTML = rows.map(itemHtml).join("");
  const empty = $("empty");
  if (rows.length) { empty.hidden = true; return; }
  empty.hidden = false;
  empty.innerHTML = `<strong>Nichts gefunden</strong>Keine Orte für diese Suche und Filter.<br><button type="button" class="link-btn" data-action="reset-all">Alles zurücksetzen</button>`;
}

function renderMerkliste() {
  const favs = DATA.filter(d => isFav(d) && matchesQuery(d)).sort((a, b) => a.name.localeCompare(b.name, "de"));
  const open = favs.filter(d => !isDone(d)), done = favs.filter(isDone);
  const totalFav = DATA.filter(isFav).length;
  const totalDone = DATA.filter(d => isFav(d) && isDone(d)).length;
  const wrap = $("merk-wrap");
  if (!totalFav) {
    wrap.innerHTML = `<div class="empty"><strong>Noch nichts gemerkt</strong>Tippe in der Liste auf ☆, um einen Ort auf die Merkliste zu setzen.</div>`;
    return;
  }
  const pct = Math.round(totalDone / totalFav * 100);
  wrap.innerHTML = `
    <div class="progress">
      <div class="txt"><b>${totalDone}</b> von <b>${totalFav}</b> gemerkten Orten besucht</div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
    </div>
    ${open.length ? `<div class="section-h">Noch offen · ${open.length}</div><ul class="list">${open.map(itemHtml).join("")}</ul>` : ""}
    ${done.length ? `<div class="section-h">Besucht · ${done.length}</div><ul class="list">${done.map(itemHtml).join("")}</ul>` : ""}
    ${!favs.length ? `<div class="empty">Keine gemerkten Orte passen zur Suche.</div>` : ""}`;
}

function renderCount(rows) {
  if (S.tab === "merkliste") {
    $("count").innerHTML = `<b>${DATA.filter(isFav).length}</b> gemerkt`;
  } else {
    $("count").innerHTML = rows.length === DATA.length ? `<b>${DATA.length}</b> Orte` : `<b>${rows.length}</b> von ${DATA.length}`;
  }
  const f = activeFilterCount();
  $("filter-dot").hidden = !f;
  $("filter-dot").textContent = f;
  const nf = DATA.filter(isFav).length;
  $("fav-badge").hidden = !nf;
  $("fav-badge").textContent = nf;
}

function renderTabs() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === S.tab));
  ["liste", "karte", "merkliste"].forEach(t => { $("view-" + t).hidden = t !== S.tab; });
  const isMerk = S.tab === "merkliste";
  $("chips").hidden = isMerk;
  $("open-filter").hidden = isMerk;
}

function renderAll() {
  const rows = filtered();
  renderTabs();
  renderChips();
  renderCount(rows);
  if (S.tab === "liste") renderList(rows);
  if (S.tab === "merkliste") renderMerkliste();
  if (S.tab === "karte") Map2.render(rows);
}

/* ---------- saving ---------- */
const queues = {};
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.tm);
  toast.tm = setTimeout(() => { t.hidden = true; }, 3200);
}
async function save(id, patch) {
  const prev = over[id];
  const next = { ...(prev || {}), ...patch, updatedAt: new Date().toISOString() };
  over = { ...over, [id]: next };
  renderAll();
  if (S.openId === id && !editing) renderDetail();
  try {
    if (db) {
      const run = () => db.collection("orte").doc(id).set(next);
      queues[id] = (queues[id] || Promise.resolve()).catch(() => {}).then(run);
      await queues[id];
    } else {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(over));
    }
    return true;
  } catch (e) {
    over = { ...over };
    if (prev) over[id] = prev; else delete over[id];
    renderAll();
    if (S.openId === id && !editing) renderDetail();
    const code = e && e.code;
    toast(code === "permission_denied" || code === "not_granted"
      ? "Nicht gespeichert: Für Änderungen brauchst du Bearbeitungsrechte."
      : "Nicht gespeichert. Prüfe die Verbindung und versuch es noch einmal.");
    return false;
  }
}
const toggleFav = id => { const d = byId.get(id); return save(id, { fav: !isFav(d) }); };
const toggleDone = id => { const d = byId.get(id); return save(id, { besucht: !isDone(d) }); };

/* ---------- sheets ---------- */
let lastFocus = null;
function openSheet(el) {
  lastFocus = document.activeElement;
  ["detail", "filters"].forEach(s => { if ($(s) !== el) { $(s).classList.remove("on"); $(s).hidden = true; } });
  $("scrim").hidden = false; el.hidden = false;
  requestAnimationFrame(() => { $("scrim").classList.add("on"); el.classList.add("on"); });
  el.scrollTop = 0;
}
function closeSheets() {
  editing = null;
  S.openId = null;
  $("scrim").classList.remove("on");
  ["detail", "filters"].forEach(s => $(s).classList.remove("on"));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => { $("scrim").hidden = true; $("detail").hidden = true; $("filters").hidden = true; }, reduce ? 0 : 220);
  if (S.tab === "karte") Map2.render(filtered());
  if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
}

function openDetail(id) {
  if (!byId.has(id)) return;
  S.openId = id; editing = null;
  renderDetail();
  openSheet($("detail"));
  if (S.tab === "karte") Map2.render(filtered());
  setTimeout(() => { const c = $("detail").querySelector(".sheet-close"); c && c.focus({ preventScroll: true }); }, 50);
}

function renderDetail() {
  const d = byId.get(S.openId);
  if (!d) return;
  const k = kat(d), ds = desc(d), n = note(d), fav = isFav(d), done = isDone(d);
  const gm = safeUrl(d.googleUrl), web = safeUrl(d.website);
  const route = isFinite(d.lat) ? `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}&travelmode=transit` : "";
  const stars = d.rating ? "★".repeat(Math.round(d.rating)) + "☆".repeat(5 - Math.round(d.rating)) : "";
  const count = d.ratingsTotal ? ` · ${Number(d.ratingsTotal).toLocaleString("de-DE")} Bewertungen` : "";
  const onMap = hasCoords(d);

  const descBody = editing === "desc"
    ? `<textarea id="ed-desc" rows="4" aria-label="Beschreibung">${esc(ds)}</textarea>
       <div class="edit-actions"><button type="button" class="btn primary" data-action="save-desc">Speichern</button><button type="button" class="btn" data-action="cancel-edit">Abbrechen</button><span class="status" id="ed-status"></span></div>`
    : (ds ? `<p>${esc(ds)}</p>` : `<p class="muted">Noch keine Beschreibung.</p>`);
  const noteBody = editing === "note"
    ? `<textarea id="ed-note" rows="3" placeholder="z. B. Dienstag Vormittag, vorher reservieren" aria-label="Notiz">${esc(n)}</textarea>
       <div class="edit-actions"><button type="button" class="btn primary" data-action="save-note">Speichern</button><button type="button" class="btn" data-action="cancel-edit">Abbrechen</button><span class="status" id="ed-status"></span></div>`
    : (n ? `<p>${esc(n)}</p>` : `<p class="muted">Tag, Uhrzeit, Reservierung … alles, was ihr euch merken wollt.</p>`);

  $("detail").innerHTML = `
    <button type="button" class="sheet-close" data-action="close" aria-label="Schließen">✕</button>
    <div class="grip"></div>
    <div class="d-head">
      <span class="stamp g-${k.g}" aria-hidden="true">${k.k}</span>
      <div>
        <div class="d-kat">${esc(d.kategorie)}${d.google_typ ? " · " + esc(d.google_typ) : ""}</div>
        <h2 id="d-name">${esc(d.name)}</h2>
        <div class="d-where">${esc(d.bezirk === OUTSIDE ? d.stadtteil.replace(/^Andere \((.*)\)$/, "$1") : d.bezirk + " · " + d.stadtteil)}</div>
        ${d.rating ? `<div class="d-rate"><span class="stars" aria-hidden="true">${stars}</span> ${fmtRating(d.rating)}${count}</div>` : ""}
      </div>
    </div>
    <div class="d-actions">
      <button type="button" class="toggle fav-t" data-action="fav" aria-pressed="${fav}"><span class="i">${fav ? "★" : "☆"}</span>${fav ? "Gemerkt" : "Merken"}</button>
      <button type="button" class="toggle done-t" data-action="done" aria-pressed="${done}"><span class="i">${done ? "✓" : "○"}</span>${done ? "Besucht" : "Als besucht markieren"}</button>
    </div>
    <div class="d-links">
      ${gm ? `<a class="pill-link primary" href="${esc(gm)}" target="_blank" rel="noopener">Google Maps ↗</a>` : ""}
      ${route ? `<a class="pill-link" href="${esc(route)}" target="_blank" rel="noopener">Route mit Öffis ↗</a>` : ""}
      ${web ? `<a class="pill-link" href="${esc(web)}" target="_blank" rel="noopener">Website ↗</a>` : ""}
      ${onMap && S.tab !== "karte" ? `<button type="button" class="pill-link" data-action="show-map">Auf der Karte</button>` : ""}
    </div>
    <div class="d-sec">
      <h3>Beschreibung ${editing !== "desc" ? `<button type="button" class="link-btn" data-action="edit-desc">${ds ? "Bearbeiten" : "Hinzufügen"}</button>` : ""}</h3>
      ${descBody}
    </div>
    <div class="d-sec">
      <h3>Unsere Notiz ${editing !== "note" ? `<button type="button" class="link-btn" data-action="edit-note">${n ? "Bearbeiten" : "Hinzufügen"}</button>` : ""}</h3>
      ${noteBody}
    </div>
    ${d.adresse ? `<div class="d-sec">
      <h3>Adresse</h3>
      <div class="addr"><p id="d-addr">${esc(d.adresse)}</p><button type="button" class="small-btn" data-action="copy">Kopieren</button></div>
    </div>` : ""}`;
  const ta = $("detail").querySelector("textarea");
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

async function saveEdit(field) {
  const ta = $(field === "desc" ? "ed-desc" : "ed-note");
  const id = S.openId;
  if (!ta || !id) return;
  $("ed-status").textContent = "Speichert …";
  const val = ta.value.trim();
  const ok = await save(id, field === "desc" ? { beschreibung: val } : { notiz: val });
  if (ok) { editing = null; if (S.openId === id) renderDetail(); }
  else if ($("ed-status")) $("ed-status").textContent = "Nicht gespeichert.";
}

function copyAddress() {
  const d = byId.get(S.openId);
  const btn = $("detail").querySelector('[data-action="copy"]');
  const done = () => { btn.textContent = "Kopiert"; setTimeout(() => { btn.textContent = "Kopieren"; }, 1600); };
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($("d-addr"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = "Markiert";
  };
  try { navigator.clipboard.writeText(d.adresse).then(done, fallback); } catch (e) { fallback(); }
}

/* ---------- filter sheet ---------- */
function buildBezirke() {
  const sel = $("f-bezirk");
  const list = [...new Set(DATA.map(d => d.bezirk))].sort((a, b) => a === OUTSIDE ? 1 : b === OUTSIDE ? -1 : a.localeCompare(b, "de"));
  list.forEach(b => {
    const o = document.createElement("option");
    o.value = b; o.textContent = `${b} (${DATA.filter(d => d.bezirk === b).length})`;
    sel.appendChild(o);
  });
}
function syncFilterSheet() {
  const mark = (id, v) => $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === String(v)));
  mark("f-region", S.region);
  mark("f-rating", S.minr);
  mark("f-sort", S.sort);
  $("f-bezirk").value = S.bezirk;
  $("f-hide").checked = S.hideDone;
}
function onFilterChange() { syncFilterSheet(); savePrefs(); renderAll(); }
$("f-region").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.region = b.dataset.v; onFilterChange(); } });
$("f-rating").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.minr = parseFloat(b.dataset.v); onFilterChange(); } });
$("f-sort").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { S.sort = b.dataset.v; onFilterChange(); } });
$("f-bezirk").addEventListener("change", e => { S.bezirk = e.target.value; onFilterChange(); });
$("f-hide").addEventListener("change", e => { S.hideDone = e.target.checked; onFilterChange(); });
$("f-reset").addEventListener("click", () => { Object.assign(S, DEFAULT_FILTERS); onFilterChange(); });
$("f-done").addEventListener("click", closeSheets);
$("open-filter").addEventListener("click", () => { syncFilterSheet(); openSheet($("filters")); });

/* ---------- map ---------- */
const hasCoords = d => isFinite(d.lat) && isFinite(d.lng);
const TOKYO_BOUNDS = [[35.585, 139.625], [35.775, 139.835]];
const NEAR_TOKYO = d => d.lat > 35.2 && d.lat < 36.1 && d.lng > 138.9 && d.lng < 140.4;

const Map2 = (() => {
  let map = null, tiles = null, layer = null, dark = null, lastRows = [];
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const isDark = () => {
    const t = document.documentElement.getAttribute("data-theme");
    return t ? t === "dark" : mq.matches;
  };
  const COLORS = { food: "--vermillion", cafe: "--gold", shop: "--indigo", calm: "--sage", misc: "--ink-soft" };

  function setTiles() {
    const want = isDark();
    if (tiles && dark === want) return;
    dark = want;
    if (tiles) map.removeLayer(tiles);
    const base = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/" + (want ? "World_Dark_Gray" : "World_Light_Gray");
    const opts = { maxZoom: 19, maxNativeZoom: 16 };
    tiles = L.layerGroup([
      L.tileLayer(base + "_Base/MapServer/tile/{z}/{y}/{x}", { ...opts, attribution: 'Karte © <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, HERE, Garmin, © OpenStreetMap' }),
      L.tileLayer(base + "_Reference/MapServer/tile/{z}/{y}/{x}", opts)
    ]).addTo(map);
  }

  function build() {
    if (!window.L) {
      $("map").innerHTML = '<div class="map-offline"><div><strong>Karte nicht verfügbar</strong><br>Die Karte braucht eine Internetverbindung. Liste und Merkliste funktionieren weiter.</div></div>';
      return false;
    }
    map = L.map("map", { zoomControl: false });
    L.control.zoom({ position: "topright", zoomInTitle: "Hineinzoomen", zoomOutTitle: "Herauszoomen" }).addTo(map);
    const Home = L.Control.extend({
      options: { position: "topright" },
      onAdd() {
        const div = L.DomUtil.create("div", "leaflet-bar home-ctl");
        div.innerHTML = '<a href="#" role="button" title="Tokio-Übersicht" aria-label="Tokio-Übersicht">⌂</a>';
        L.DomEvent.on(div.firstChild, "click", e => { L.DomEvent.preventDefault(e); map.fitBounds(TOKYO_BOUNDS); });
        L.DomEvent.disableClickPropagation(div);
        return div;
      }
    });
    new Home().addTo(map);
    map.attributionControl.setPrefix(false);
    map.fitBounds(TOKYO_BOUNDS);
    layer = L.layerGroup().addTo(map);
    setTiles();
    if (mq.addEventListener) mq.addEventListener("change", () => { setTiles(); render(lastRows); });
    return true;
  }

  function render(rows) {
    lastRows = rows;
    if (!map && !build()) return;
    map.invalidateSize();
    layer.clearLayers();
    const card = css("--card");
    // Favoriten zuletzt zeichnen, damit sie oben liegen
    const pts = rows.filter(hasCoords).slice().sort((a, b) => isFav(a) - isFav(b));
    pts.forEach(d => {
      const sel = d.id === S.openId, fav = isFav(d), done = isDone(d);
      const m = L.circleMarker([d.lat, d.lng], {
        radius: sel ? 11 : fav ? 8 : 6.5,
        color: sel ? css("--ink") : fav ? css("--gold") : card,
        weight: sel || fav ? 3 : 1.5,
        opacity: 1,
        fillColor: css(COLORS[kat(d).g]),
        fillOpacity: done ? 0.45 : 0.95
      });
      m.bindTooltip(esc(d.name) + (fav ? " ★" : ""), { direction: "top", offset: [0, -6] });
      m.on("click", () => openDetail(d.id));
      m.addTo(layer);
    });
    const far = pts.filter(d => !NEAR_TOKYO(d)).length;
    $("map-note").innerHTML = `<b>${pts.length}</b> Orte auf der Karte` +
      (far ? ` · ${far} davon außerhalb Tokios (z. B. Kyoto, Nikkō) – <button type="button" class="link-btn" data-action="fit-all">alle zeigen</button>` : "");
  }

  function fitAll() {
    const pts = lastRows.filter(hasCoords);
    if (map && pts.length) map.fitBounds(L.latLngBounds(pts.map(d => [d.lat, d.lng])), { padding: [30, 30] });
  }
  function focus(d) {
    if (map && hasCoords(d)) map.setView([d.lat, d.lng], 16);
  }
  window.addEventListener("resize", () => { if (map && S.tab === "karte") map.invalidateSize(); });

  $("legend").innerHTML = GROUPS.map(([g, n]) => `<span><i style="background:var(${COLORS[g]})"></i>${n}</span>`).join("");
  return { render, focus, fitAll };
})();

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const favBtn = e.target.closest("[data-fav]");
  if (favBtn) { toggleFav(favBtn.dataset.fav); return; }
  const open = e.target.closest("[data-open]");
  if (open) { openDetail(open.dataset.open); return; }
  const chip = e.target.closest(".chip");
  if (chip) {
    const k = chip.dataset.kat;
    if (!k) S.kat.clear();
    else if (S.kat.has(k)) S.kat.delete(k);
    else S.kat.add(k);
    savePrefs(); renderAll();
    return;
  }
  const tab = e.target.closest(".tab");
  if (tab) { S.tab = tab.dataset.tab; savePrefs(); renderAll(); return; }
  const act = e.target.closest("[data-action]");
  if (!act) return;
  const a = act.dataset.action, id = S.openId;
  if (a === "close") closeSheets();
  else if (a === "fav") toggleFav(id);
  else if (a === "done") toggleDone(id);
  else if (a === "edit-desc") { editing = "desc"; renderDetail(); }
  else if (a === "edit-note") { editing = "note"; renderDetail(); }
  else if (a === "cancel-edit") { editing = null; renderDetail(); }
  else if (a === "save-desc") saveEdit("desc");
  else if (a === "save-note") saveEdit("note");
  else if (a === "copy") copyAddress();
  else if (a === "show-map") {
    const d = byId.get(id);
    closeSheets();
    S.tab = "karte"; savePrefs();
    renderAll();
    Map2.focus(d);
  }
  else if (a === "fit-all") Map2.fitAll();
  else if (a === "far-list") { S.tab = "liste"; S.region = "Andere Region"; savePrefs(); renderAll(); }
  else if (a === "reset-all") {
    Object.assign(S, DEFAULT_FILTERS); S.kat.clear(); S.q = ""; $("q").value = ""; $("clear-q").hidden = true;
    savePrefs(); renderAll();
  }
});
$("scrim").addEventListener("click", closeSheets);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("scrim").hidden) closeSheets();
});
let qTimer;
$("q").addEventListener("input", e => {
  $("clear-q").hidden = !e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); renderAll(); }, 80);
});
$("clear-q").addEventListener("click", () => { $("q").value = ""; $("clear-q").hidden = true; S.q = ""; renderAll(); $("q").focus(); });

/* ---------- start ---------- */
loadPrefs();
try { over = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}") || {}; } catch (e) { over = {}; }
buildBezirke();
renderAll();

(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) return;
  over = {};
  db.collection("orte").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(s => { const v = s.data(); if (v) next[s.id] = v; });
    over = next;
    renderAll();
    if (S.openId && !editing) renderDetail();
  }, () => { toast("Live-Abgleich unterbrochen. Lade die Seite neu, um Änderungen anderer zu sehen."); });
})();
</script>
